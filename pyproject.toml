[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mooremind"
version = "0.1.0"
description = "A small non-LLM learner that stores atomic thoughts and learns a fact when it is taught."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "André Slabber" }]
keywords = ["atomic-thought", "common-sense", "learner", "mooremind"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
eval = [
    "mooresense @ git+https://github.com/mooretech-one/mooresense.git@de388dc80807fbb232aef98d6593f52808f8769e",
]

[project.urls]
Homepage = "https://github.com/mooretech-one/mooremind"
Repository = "https://github.com/mooretech-one/mooremind"
Issues = "https://github.com/mooretech-one/mooremind/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mooremind"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]
